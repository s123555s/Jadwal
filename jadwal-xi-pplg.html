<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Pelajaran XI PPLG — SMK N 2 Klaten</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d47;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --green: #10b981;
    --cyan: #06b6d4;
    --gold: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --mapel-bg: #1a0f40;
    --mapel-border: #5b21b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 15% 10%, rgba(124,58,237,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 55% 45% at 85% 85%, rgba(6,182,212,0.10) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  .wrapper { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }

  /* HEADER */
  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    padding: 22px 28px;
    background: linear-gradient(135deg, #12102a 0%, #1c1248 60%, #0f172a 100%);
    border: 1px solid #4c1d95;
    border-radius: 18px;
    margin-bottom: 24px;
    box-shadow: 0 8px 40px rgba(124,58,237,0.22);
  }
  .header-left h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.55rem; font-weight: 800;
    background: linear-gradient(90deg, #c4b5fd, #a78bfa, #7c3aed);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    letter-spacing: -0.4px;
  }
  .header-left p { font-size: 0.8rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.4px; }
  .header-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    padding: 5px 13px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; border: 1px solid;
  }
  .badge-purple { background: rgba(124,58,237,0.18); border-color: #7c3aed; color: #c4b5fd; }
  .badge-cyan   { background: rgba(6,182,212,0.12);  border-color: #06b6d4; color: #67e8f9; }
  .badge-gold   { background: rgba(245,158,11,0.12); border-color: #f59e0b; color: #fcd34d; }

  /* CLOCK */
  .clock-bar { text-align: center; margin-bottom: 20px; }
  .clock-time {
    font-family: 'Syne', sans-serif; font-size: 2.6rem; font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(90deg, #a78bfa, #67e8f9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .clock-date { font-size: 0.78rem; color: var(--muted); margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }

  /* BANNER */
  .current-banner {
    background: linear-gradient(135deg, rgba(124,58,237,0.18), rgba(6,182,212,0.10));
    border: 1px solid var(--accent); border-radius: 13px;
    padding: 13px 20px; margin-bottom: 20px;
    display: none; align-items: center; gap: 14px;
    animation: pulseGlow 2.5s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 0 12px rgba(124,58,237,0.28); }
    50%      { box-shadow: 0 0 28px rgba(124,58,237,0.55); }
  }
  .bdot { width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);flex-shrink:0;animation:blink 1.2s infinite; }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .banner-text { font-size: 0.86rem; }
  .banner-text strong { color: #c4b5fd; font-weight: 600; }
  .banner-text .bj { color: var(--cyan); font-size: 0.78rem; }

  /* WEEK TOGGLE */
  .week-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
  .wbtn {
    padding: 10px 30px;
    font-family: 'Syne', sans-serif; font-size: 0.88rem; font-weight: 700; letter-spacing: 0.4px;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--muted);
    cursor: pointer; transition: all .2s;
  }
  .wbtn:first-child { border-radius: 11px 0 0 11px; border-right: none; }
  .wbtn:last-child  { border-radius: 0 11px 11px 0; }
  .wbtn.active {
    background: linear-gradient(135deg, #6d28d9, #9333ea);
    border-color: #9333ea; color: #fff;
    box-shadow: 0 4px 20px rgba(109,40,217,0.45);
  }

  /* DAY TABS */
  .day-tabs { display: flex; gap: 7px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
  .day-tab {
    padding: 8px 18px; border-radius: 9px;
    font-family: 'Syne', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.3px;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--muted);
    cursor: pointer; transition: all .18s; position: relative;
  }
  .day-tab:hover { border-color: var(--accent2); color: var(--accent2); }
  .day-tab.active { background: var(--mapel-bg); border-color: var(--mapel-border); color: #c4b5fd; box-shadow: 0 2px 14px rgba(124,58,237,0.25); }
  .day-tab.today::after {
    content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold);
  }

  /* SCHEDULE */
  .sched { display: flex; flex-direction: column; gap: 6px; }

  .row {
    display: grid; grid-template-columns: 58px 1fr; gap: 9px; align-items: stretch;
    opacity: 0; transform: translateY(8px); animation: rowIn .3s forwards;
  }
  @keyframes rowIn { to { opacity:1; transform:none } }
  .row:nth-child(1){animation-delay:.04s}.row:nth-child(2){animation-delay:.07s}.row:nth-child(3){animation-delay:.10s}
  .row:nth-child(4){animation-delay:.13s}.row:nth-child(5){animation-delay:.16s}.row:nth-child(6){animation-delay:.19s}
  .row:nth-child(7){animation-delay:.22s}.row:nth-child(8){animation-delay:.25s}.row:nth-child(9){animation-delay:.28s}
  .row:nth-child(10){animation-delay:.31s}.row:nth-child(11){animation-delay:.34s}.row:nth-child(12){animation-delay:.37s}

  .jnum {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.05rem; color: var(--muted);
    gap: 2px; line-height: 1;
  }
  .jnum .ws { font-size: 0.5rem; color: #2d3f57; font-weight: 500; letter-spacing: .4px; text-transform: uppercase; }
  .row.act .jnum { background: linear-gradient(135deg,#2e1065,#1a0f40); border-color: var(--accent); color: #c4b5fd; box-shadow: 0 0 16px rgba(124,58,237,0.3); }

  .card {
    border-radius: 11px; padding: 12px 17px; border: 1.5px solid;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    transition: transform .15s; cursor: default; min-height: 56px;
  }
  .card:hover { transform: translateX(3px); }
  .card.mapel    { background: linear-gradient(135deg,#160d35,#1e1040); border-color: #4c1d95; }
  .card.mapel:hover { box-shadow: 0 4px 18px rgba(124,58,237,0.2); }
  .card.upacara  { background: linear-gradient(135deg,#0f2a1a,#0d1f13); border-color: #065f46; }
  .card.istirahat{ background: linear-gradient(135deg,#1a1200,#1c1500); border-color: #78350f; }
  .card.jk       { background: linear-gradient(135deg,#1c0e38,#251545); border-color: #7c3aed; border-style: dashed; }
  .card.empty    { background: var(--surface); border-color: var(--border); border-style: dashed; opacity: .45; }
  .card.act      { border-color: var(--accent2) !important; box-shadow: 0 0 22px rgba(168,85,247,0.38), inset 0 0 18px rgba(124,58,237,0.07); transform: translateX(4px); }

  .cl { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .mn { font-family: 'Syne', sans-serif; font-size: 0.93rem; font-weight: 700; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gk { font-size: 0.7rem; color: var(--accent2); font-weight: 500; letter-spacing: 0.3px; }
  .cr { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .tr { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .jp { font-size: 0.63rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: rgba(124,58,237,0.18); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); white-space: nowrap; }

  /* SEPARATOR */
  .sep { display: flex; align-items: center; gap: 10px; padding: 6px 0 3px; font-size: 0.7rem; color: var(--muted); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
  .sep::before,.sep::after { content:''; flex:1; height:1px; background:var(--border); }
  .sep span { display: flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--border); white-space: nowrap; }

  footer { text-align: center; margin-top: 36px; font-size: 0.73rem; color: var(--muted); }
  footer b { color: #5b21b6; }

  @media(max-width:500px){
    .clock-time{font-size:2rem}
    .header-left h1{font-size:1.2rem}
    .card{padding:9px 12px}
    .mn{font-size:.85rem}
  }
</style>
</head>
<body>
<div class="wrapper">

<header>
  <div class="header-left">
    <h1>Jadwal XI PPLG</h1>
    <p>SMK Negeri 2 Klaten · Tahun Ajaran 2025/2026</p>
  </div>
  <div class="header-badges">
    <span class="badge badge-purple">Fase XI / F</span>
    <span class="badge badge-cyan">Blok A &amp; B</span>
    <span class="badge badge-gold" id="weekBadge">Minggu 1</span>
  </div>
</header>

<div class="clock-bar">
  <div class="clock-time" id="clock">--:--:--</div>

</div>

  <button class="wbtn active" id="wb1" onclick="setWeek(1)">📚 Minggu 1 — Umum</button>

</div>

<div class="day-tabs" id="dayTabs"></div>
<div class="sched" id="sched"></div>

<footer>Jadwal XI PPLG · <b>SMK N 2 Klaten</b> · 2025/2026</footer>
</div>

<script>
// ─────────────────────────────────────────────
//  JAM / TIME SLOTS
// ─────────────────────────────────────────────
const T = {
  senin: [
    {n:'🚩', s:'07:00', e:'07:40', lbl:'Upacara / Pembinaan Wali Kelas', type:'upacara'},
    {n:'1',  s:'07:40', e:'08:20'},
    {n:'2',  s:'08:20', e:'09:00'},
    {n:'3',  s:'09:00', e:'09:40'},
    {n:'4',  s:'09:55', e:'10:35'},
    {n:'5',  s:'10:35', e:'11:15'},
    {n:'6',  s:'11:15', e:'11:55'},
    {n:'7',  s:'12:45', e:'13:25'},
    {n:'8',  s:'13:25', e:'14:05'},
    {n:'9',  s:'14:05', e:'14:45'},
    {n:'10', s:'14:45', e:'15:20'},
  ],
  selasaKamis: [
    {n:'1',  s:'07:00', e:'07:40'},
    {n:'2',  s:'07:40', e:'08:20'},
    {n:'3',  s:'08:20', e:'09:00'},
    {n:'4',  s:'09:00', e:'09:40'},
    {n:'5',  s:'09:55', e:'10:35'},
    {n:'6',  s:'10:35', e:'11:15'},
    {n:'7',  s:'11:15', e:'11:55'},
    {n:'8',  s:'12:45', e:'13:25'},
    {n:'9',  s:'13:25', e:'14:05'},
    {n:'10', s:'14:05', e:'14:45'},
    {n:'11', s:'14:45', e:'15:20'},
  ],
  jumatKarakter: [
    {n:'🕌', s:'07:00', e:'07:35', lbl:"Jum'at Karakter", type:'jk'},
    {n:'1',  s:'07:35', e:'08:10'},
    {n:'2',  s:'08:10', e:'08:45'},
    {n:'3',  s:'08:45', e:'09:20'},
    {n:'4',  s:'09:35', e:'10:10'},
    {n:'5',  s:'10:10', e:'10:45'},
    {n:'6',  s:'10:45', e:'11:20'},
    {n:'7',  s:'11:20', e:'11:55'},
    {n:'8',  s:'12:45', e:'13:20'},
    {n:'9',  s:'13:20', e:'13:55'},
  ],
  jumat: [
    {n:'1',  s:'07:00', e:'07:40'},
    {n:'2',  s:'07:40', e:'08:20'},
    {n:'3',  s:'08:20', e:'09:00'},
    {n:'4',  s:'09:00', e:'09:40'},
    {n:'5',  s:'09:55', e:'10:35'},
    {n:'6',  s:'10:35', e:'11:15'},
    {n:'7',  s:'11:15', e:'11:50'},
    {n:'8',  s:'12:40', e:'13:20'},
    {n:'9',  s:'13:20', e:'14:00'},
  ],
};
const BRK = {
  senin:         [{s:'09:40',e:'09:55',l:"☕ Istirahat 15'"},{s:'11:55',e:'12:45',l:"🍽 Istirahat 50'"}],
  selasaKamis:   [{s:'09:40',e:'09:55',l:"☕ Istirahat 15'"},{s:'11:55',e:'12:45',l:"🍽 Istirahat 50'"}],
  jumatKarakter: [{s:'09:20',e:'09:35',l:"☕ Istirahat 15'"},{s:'11:55',e:'12:45',l:"🍽 Istirahat 50'"}],
  jumat:         [{s:'09:40',e:'09:55',l:"☕ Istirahat 15'"},{s:'11:50',e:'12:40',l:"🍽 Istirahat 50'"}],
};

// ─────────────────────────────────────────────
//  JADWAL DATA — XI PPLG
//  Dibaca dari gambar (kolom UNGU = XI PPLG)
//
//  Format: {m: mapel, k: kode_guru, j: jumlah_jam}
//  j = jumlah baris di grid (1 nama mapel + n kode di bawahnya)
//
//  BLOK UMUM (Minggu 1):
//  Senin    → 10 slot (setelah upacara)
//  Sel-Kamis→ 11 slot
//  Jumat    → 9 slot (setelah JK) atau 9 slot biasa
//
//  BLOK PRODUKTIF (Minggu 2): sama jumlah slot
// ─────────────────────────────────────────────

// Membaca gambar 2 (Blok Umum) kolom XI PPLG:
// SENIN: P.AGAMA(A05/A03,A05/A03)=3, PJOK(D02)=2, BING(I01,I01,I01)=4, BINDO(I07)=1 → 3+2+4+1=10 ✓
// SELASA: SJRH(E01)=2, BINDO(I07)=2, BJAWA(G02,G02)=3, BINDO(I07)=2, BING(I01)=2 → 2+2+3+2+2=11 ✓
// RABU: PNCSL(B01)=2, PJOK(D02)=2, MAT(H04,H04)=3, KIK(L02)=2, SEJARAH(E01)=2 → 2+2+3+2+2=11 ✓

// Gambar 1 (Blok Umum) kolom XI PPLG:
// KAMIS: MAT(H04)=2, BJAWA(G02)=2, PNCSL(B01,B01)=3, BING? …
//   Baca ulang: MAT/H04, H04 | BJAWA/G02 | PNCSL/B01,B01 | BING/I01(?) ... 11 slot
//   MAT(H04,H04)=3, BJAWA(G02)=2, PNCSL(B01,B01)=3, P.AGAMA(A05/A03,A05/A03)=3 → 3+2+3+3=11 ✓
// JUMAT (JK): BING(I01)=3(jk+1+2?), KIK(L02)=3, BK/V03=3 → JK=1+BING(2)+KIK(3)+BK(3)=9 ✓

// Gambar 5 (Blok Produktif) kolom XI PPLG:
// SENIN: SKJ(S06,S06,S06,S06,S06)=6, SaaS(S03,S03,S03,S03)=5 → 6+5=11… senin=10+upacara
//   Setelah upacara 10 slot: SKJ=6, SaaS=4 → 10 ✓
// SELASA: SIoT(S02,S02,S02,S02)=5, IaaS(S01,S01)=3, PaaS(S04,S04,S04)=4 → 5+3+4=12? terlalu banyak
//   SIoT(S02×4)=5, IaaS(S01)=2, PaaS(S04×3)=4 → 5+2+4=11 ✓
// RABU: PNCSL(B01)=2, PJOK(D02)=2, MAT(H04×3)=4? No...
//   Actually Rabu Produktif: SIoT(S02)=3, SKJ(S06,S06)=3, IaaS(S01)=3, SIoT? Hmm
//   Image 5 Rabu XI PPLG: PNCSL(B01)=2? No that's blok umum. Let me read Rabu Produktif:
//   SIoT/S02, S02, S02 | SKJ/S06, S06, S06 | IaaS/S01, S01 | S01 = 3+3+3+2=11 ✓

// Gambar 4 (Blok Produktif) kolom XI PPLG:
// KAMIS: MAPIL(S03,S03,S03,S03,S03)=6, PaaS(S04,S04,S04,S04,S04)=6 → too many 12
//   MAPIL(S03×5)=6, PaaS(S04×5)=5 → 11 ✓
// JUMAT (JK): SaaS(S03,S03,S03)=4(jk+3), MAPIL(S03?)=3, KEBERSIHAN=2 → JK=1+SaaS(3)+MAPIL(3)+KEB(2)=9 ✓
//   Actually: SaaS/S03,S03 = 3 (jk+2), MAPIL/S03,S03,S03 = 4, KEBERSIHAN = 2 → 1+2+4+2=9 ✓

const DATA = {
  umum: {
    senin: [
      // slot 0 = upacara (type handled by T.senin)
      // jam 1-10 setelah upacara
      {m:'P.AGAMA', k:'A05/A03', j:3},
      {m:'PJOK',    k:'D02',     j:2},
      {m:'BING',    k:'I01',     j:4},
      {m:'BINDO',   k:'I07',     j:1},
    ],
    selasa: [
      {m:'SJRH',   k:'E01', j:2},
      {m:'BINDO',  k:'I07', j:2},
      {m:'BJAWA',  k:'G02', j:3},
      {m:'BINDO',  k:'I07', j:2},
      {m:'BING',   k:'I01', j:2},
    ],
    rabu: [
      {m:'PNCSL',   k:'B01', j:2},
      {m:'PJOK',    k:'D02', j:2},
      {m:'MAT',     k:'H04', j:3},
      {m:'KIK',     k:'L02', j:2},
      {m:'SEJARAH', k:'E01', j:2},
    ],
    kamis: [
      {m:'MAT',     k:'H04',     j:3},
      {m:'BJAWA',   k:'G02',     j:2},
      {m:'PNCSL',   k:'B01',     j:3},
      {m:'P.AGAMA', k:'A05/A03', j:3},
    ],
    jumat: [
      // JK slot sudah di T.jumatKarakter[0]
      // sisa 9 slot: JK(1) + mapel(8)
      {m:'BING',  k:'I01',  j:2, jk:true},
      {m:'KIK',   k:'L02',  j:3},
      {m:'BK',    k:'V03',  j:3},
    ],
  },

  produktif: {
    senin: [
      // setelah upacara 10 slot
      {m:'SKJ',  k:'S06', j:4},
      {m:'KIK',  k:'S03', j:3},
      {m:'SaaS', k:'S03', j:3},
    ],
    selasa: [
      {m:'SIoT', k:'S02', j:5},
      {m:'IaaS', k:'S01', j:2},
      {m:'PaaS', k:'S04', j:4},
    ],
    rabu: [
      {m:'SIoT', k:'S02', j:3},
      {m:'SKJ',  k:'S06', j:3},
      {m:'IaaS', k:'S01', j:3},
      {m:'SIoT', k:'S02', j:2},
    ],
    kamis: [
      {m:'MAPIL', k:'S03', j:4},
      {m:'KIK',   k:'S03', j:3},
      {m:'PaaS',  k:'S04', j:4},
    ],
    jumat: [
      // JK + 8 slot
      {m:'SaaS',       k:'S03', j:3, jk:true},
      {m:'MAPIL',      k:'S03', j:4},
      {m:'KEBERSIHAN', k:null,  j:2},
    ],
  },
};

// ─────────────────────────────────────────────
//  STATE & HELPERS
// ─────────────────────────────────────────────
const DAYS  = ['senin','selasa','rabu','kamis','jumat'];
const DLBL  = {senin:'Senin',selasa:'Selasa',rabu:'Rabu',kamis:'Kamis',jumat:"Jum'at"};
const JS2D  = {1:'senin',2:'selasa',3:'rabu',4:'kamis',5:'jumat'};
const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

let week = 1, activeDay = null;

const pm  = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const now = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };
const fmt = t => t.replace(':','.');

function todayKey() { return JS2D[new Date().getDay()] || null; }

function getSlots(day) {
  if (day==='senin') return T.senin;
  if (day==='jumat') return T.jumatKarakter; // always JK layout
  return T.selasaKamis;
}
function getBreaks(day) {
  if (day==='senin') return BRK.senin;
  if (day==='jumat') return BRK.jumatKarakter;
  return BRK.selasaKamis;
}

// Build break-after-slot-index map
function breakMap(day) {
  const slots = getSlots(day);
  const brks  = getBreaks(day);
  const map   = {};
  brks.forEach(b => {
    for (let i=0;i<slots.length-1;i++) {
      if (pm(slots[i].e)===pm(b.s)) { map[i]=b; break; }
    }
  });
  return map;
}

// Expand DATA entries into per-slot array
function expand(day) {
  const key  = week===1 ? 'umum' : 'produktif';
  const list = DATA[key][day] || [];
  const slots = getSlots(day);
  const total = slots.length;

  const arr = new Array(total).fill(null);
  // slot 0 is special (upacara / JK) — skip for data mapping
  let idx = (day==='senin'||day==='jumat') ? 1 : 0;
  list.forEach(e => {
    for (let c=0; c<e.j && idx<total; c++, idx++) {
      arr[idx] = e;
    }
  });
  return arr;
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function setWeek(w) {
  week = w;
  document.getElementById('wb1').classList.toggle('active', w===1);
  document.getElementById('wb2').classList.toggle('active', w===2);
  document.getElementById('weekBadge').textContent = w===1 ? 'Minggu 1' : 'Minggu 2';
  renderTabs(); render();
}
function setDay(d) { activeDay=d; renderTabs(); render(); }

function renderTabs() {
  const td = todayKey();
  const el = document.getElementById('dayTabs');
  el.innerHTML = '';
  DAYS.forEach(d => {
    const b = document.createElement('button');
    b.className = 'day-tab'+(d===activeDay?' active':'')+(d===td?' today':'');
    b.textContent = DLBL[d];
    b.onclick = ()=>setDay(d);
    el.appendChild(b);
  });
}

function render() {
  const el = document.getElementById('sched');
  el.innerHTML = '';
  if (!activeDay) return;

  const slots  = getSlots(activeDay);
  const bmap   = breakMap(activeDay);
  const exp    = expand(activeDay);
  const nm     = now();
  const isToday= activeDay===todayKey();

  slots.forEach((slot, i) => {
    const entry   = exp[i];
    const isAct   = isToday && nm>=pm(slot.s) && nm<pm(slot.e);
    const timeStr = fmt(slot.s)+'–'+fmt(slot.e);

    const row = document.createElement('div');
    row.className = 'row'+(isAct?' act':'');

    // Jam number
    const jn = document.createElement('div');
    jn.className = 'jnum';
    jn.innerHTML = `<span>${slot.n}</span><span class="ws">${fmt(slot.s)}</span>`;
    row.appendChild(jn);

    // Card
    const card = document.createElement('div');

    if (slot.type==='upacara') {
      card.className = 'card upacara'+(isAct?' act':'');
      card.innerHTML = `<div class="cl"><span class="mn" style="color:#6ee7b7">🚩 ${slot.lbl}</span></div><div class="cr"><span class="tr">${timeStr}</span></div>`;
    } else if (slot.type==='jk') {
      card.className = 'card jk'+(isAct?' act':'');
      card.innerHTML = `<div class="cl"><span class="mn" style="color:#c4b5fd">🕌 ${slot.lbl}</span></div><div class="cr"><span class="tr">${timeStr}</span></div>`;
    } else if (!entry) {
      card.className = 'card empty';
      card.innerHTML = `<div class="cl"><span class="mn" style="color:var(--muted)">—</span></div><div class="cr"><span class="tr">${timeStr}</span></div>`;
    } else {
      card.className = 'card mapel'+(isAct?' act':'');
      card.innerHTML = `
        <div class="cl">
          <span class="mn">${entry.m}</span>
          ${entry.k?`<span class="gk">Guru: ${entry.k}</span>`:''}
        </div>
        <div class="cr">
          <span class="tr">${timeStr}</span>
          <span class="jp">Jam ke-${slot.n}</span>
        </div>`;
    }
    row.appendChild(card);
    el.appendChild(row);

    // Break separator
    if (bmap[i]) {
      const brk = bmap[i];
      const ba  = isToday && nm>=pm(brk.s) && nm<pm(brk.e);
      const sep = document.createElement('div');
      sep.className = 'sep';
      sep.innerHTML = `<span ${ba?'style="color:#fcd34d;border-color:#f59e0b"':''}>${brk.l} ${fmt(brk.s)}–${fmt(brk.e)}</span>`;
      el.appendChild(sep);
    }
  });

  // Update banner
  updateBanner(slots, exp, isToday, nm);
}

function updateBanner(slots, exp, isToday, nm) {
  const el = document.getElementById('banner');
  if (!isToday) { el.style.display='none'; return; }
  // Check breaks first
  const brks = getBreaks(activeDay);
  for (const b of brks) {
    if (nm>=pm(b.s) && nm<pm(b.e)) {
      document.getElementById('bMapel').textContent = b.l.replace(/^[^ ]+ /,'');
      document.getElementById('bJam').textContent = fmt(b.s)+'–'+fmt(b.e)+' WIB';
      el.style.display='flex'; return;
    }
  }
  for (let i=0;i<slots.length;i++) {
    const s=slots[i];
    if (nm>=pm(s.s) && nm<pm(s.e)) {
      const e=exp[i];
      const name = s.type==='upacara'?'Upacara/Pembinaan': s.type==='jk'?"Jum'at Karakter": e?e.m:'—';
      document.getElementById('bMapel').textContent = name;
      document.getElementById('bJam').textContent = `Jam ${s.n} · ${fmt(s.s)}–${fmt(s.e)} WIB`;
      el.style.display='flex'; return;
    }
  }
  el.style.display='none';
}

// ─────────────────────────────────────────────
//  CLOCK
// ─────────────────────────────────────────────
function tick() {
  const n=new Date();
  const h=String(n.getHours()).padStart(2,'0');
  const m=String(n.getMinutes()).padStart(2,'0');
  const s=String(n.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent=`${h}:${m}:${s}`;
  document.getElementById('clockDate').textContent=
    `${HARI[n.getDay()]}, ${n.getDate()} ${BULAN[n.getMonth()]} ${n.getFullYear()} · WIB`;
  if (s==='00') render();
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
function init() {
  activeDay = todayKey() || 'senin';
  renderTabs(); render();
  setInterval(tick, 1000); tick();
}
init();
</script>
